services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.handson.rule=Host(`handson.tools`) || HostRegexp(`{sub:[a-z0-9-]+}.handson.tools`)
      - traefik.http.routers.handson.entrypoints=websecure
      - traefik.http.routers.handson.tls=true
      - traefik.http.routers.handson.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}
      - traefik.http.routers.handson.tls.domains[0].main=handson.tools
      - traefik.http.routers.handson.tls.domains[0].sans=*.handson.tools
      - traefik.http.services.handson.loadbalancer.server.port=3000
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
