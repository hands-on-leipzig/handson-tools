services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Resolver "le" is the existing HTTP-01 ACME on this Traefik. Wildcard
      # certs need le-dns (DNS-01) later; until then list each Host() so le
      # can issue a certificate. HostRegexp still routes other subdomains.
      - traefik.http.routers.handson.rule=Host(`handson.tools`) || Host(`www.handson.tools`) || Host(`flow.handson.tools`) || Host(`dev.handson.tools`) || Host(`test.handson.tools`) || Host(`rg.handson.tools`) || Host(`jury.handson.tools`) || Host(`pfand.handson.tools`) || HostRegexp(`^[a-z0-9-]+\.handson\.tools$`)
      - traefik.http.routers.handson.entrypoints=websecure
      - traefik.http.routers.handson.tls=true
      - traefik.http.routers.handson.tls.certresolver=le
      - traefik.http.services.handson.loadbalancer.server.port=3000
    networks:
      - egress
      - proxy

networks:
  proxy:
    external: true
  egress:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.90.0/24
        - subnet: fd4c:1a7b:9e20:1::/64
