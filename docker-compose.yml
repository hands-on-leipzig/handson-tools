services:
  flow-hop:
    image: alpine/socat
    restart: unless-stopped
    network_mode: host
    command:
      - "-d"
      - "-d"
      - "TCP-LISTEN:4180,fork,reuseaddr"
      - "TCP6:flow.hands-on-technology.org:443"

  gateway:
    build:
      context: .
      additional_contexts:
        glass: ../glass
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "3000"
      FLOW_HOP_HOST: host.docker.internal
      FLOW_HOP_PORT: "4180"
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    depends_on:
      - flow-hop
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Known names: HTTP-01 resolver "le" (already on this Traefik).
      - traefik.http.routers.handson.rule=Host(`handson.tools`) || Host(`www.handson.tools`) || Host(`flow.handson.tools`) || Host(`dev.handson.tools`) || Host(`test.handson.tools`) || Host(`rg.handson.tools`) || Host(`jury.handson.tools`) || Host(`pfand.handson.tools`)
      - traefik.http.routers.handson.entrypoints=websecure
      - traefik.http.routers.handson.priority=20
      - traefik.http.routers.handson.tls=true
      - traefik.http.routers.handson.tls.certresolver=le
      - traefik.http.services.handson.loadbalancer.server.port=3000
      # Unknown *.handson.tools → same service. Valid cert needs Traefik resolver
      # le-dns (DNS-01 wildcard). See deploy/traefik-le-dns.txt. Without it Traefik
      # serves the default cert (ORCA) for names not in the Host() list above.
      - traefik.http.routers.handson-star.rule=HostRegexp(`^[a-z0-9-]+\.handson\.tools$`)
      - traefik.http.routers.handson-star.entrypoints=websecure
      - traefik.http.routers.handson-star.priority=10
      - traefik.http.routers.handson-star.tls=true
      - traefik.http.routers.handson-star.tls.certresolver=le-dns
      - traefik.http.routers.handson-star.tls.domains[0].main=handson.tools
      - traefik.http.routers.handson-star.tls.domains[0].sans=*.handson.tools
      - traefik.http.routers.handson-star.service=handson
    networks:
      - egress
      - proxy

networks:
  proxy:
    external: true
  egress:
    driver: bridge
